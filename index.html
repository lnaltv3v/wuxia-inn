<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="俠客棧 — 武俠客棧經營 × 放置養成 × 自動即時戰鬥" />
  <title>俠客棧</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">俠客棧<small>客棧經營 · 放置養成 · 自動戰鬥</small></div>
      <div class="stats">
        <span>銀兩 <b id="stat-silver">0</b></span>
        <span>聲望 <b id="stat-rep">0</b></span>
        <span id="stat-inn">Lv.1</span>
        <span class="save-ok" id="stat-save">自動存檔</span>
      </div>
      <div class="top-actions">
        <button class="btn tiny" id="btn-manual-save" type="button">存檔</button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab-btn active" type="button" data-tab="inn" role="tab">🏯 客棧</button>
      <button class="tab-btn" type="button" data-tab="outposts" role="tab">🗺️ 據點</button>
      <button class="tab-btn" type="button" data-tab="heroes" role="tab">⚔️ 俠客</button>
      <button class="tab-btn" type="button" data-tab="combat" role="tab">🗡️ 戰鬥</button>
      <button class="tab-btn" type="button" data-tab="log" role="tab">📜 日誌</button>
    </nav>

    <main>
      <section id="panel-inn" class="panel" role="tabpanel"></section>
      <section id="panel-outposts" class="panel hidden" role="tabpanel"></section>
      <section id="panel-heroes" class="panel hidden" role="tabpanel"></section>
      <section id="panel-combat" class="panel hidden" role="tabpanel"></section>
      <section id="panel-log" class="panel hidden" role="tabpanel"></section>
    </main>

    <footer class="footer">俠客棧 v0.3 · 墨色江湖 · 本地存檔</footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
