<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="俠客棧 — 武俠客棧經營 × 放置養成 × 自動即時戰鬥 · 墨點江湖 Ink-Pixel Inn" />
  <title>俠客棧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="ink-pixel-theme">
  <div class="app">
    <header class="topbar px-frame">
      <div class="brand">俠客棧<small>客棧經營 · 放置養成 · 自動戰鬥</small></div>
      <div class="stats">
        <span class="stat-chip">銀兩 <b id="stat-silver">0</b></span>
        <span class="stat-chip">聲望 <b id="stat-rep">0</b></span>
        <span class="stat-chip" id="stat-inn">Lv.1</span>
        <span class="save-ok" id="stat-save">自動存檔</span>
      </div>
      <div class="top-actions">
        <button class="btn tiny" id="btn-manual-save" type="button">存檔</button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab-btn active" type="button" data-tab="inn" role="tab"><span class="px-ico">🏯</span> 客棧</button>
      <button class="tab-btn" type="button" data-tab="outposts" role="tab"><span class="px-ico">🗺️</span> 據點</button>
      <button class="tab-btn" type="button" data-tab="heroes" role="tab"><span class="px-ico">⚔️</span> 俠客</button>
      <button class="tab-btn" type="button" data-tab="combat" role="tab"><span class="px-ico">🗡️</span> 戰鬥</button>
      <button class="tab-btn" type="button" data-tab="story" role="tab"><span class="px-ico">📖</span> 江湖</button>
      <button class="tab-btn" type="button" data-tab="log" role="tab"><span class="px-ico">📜</span> 日誌</button>
    </nav>

    <main>
      <section id="panel-inn" class="panel" role="tabpanel"></section>
      <section id="panel-outposts" class="panel hidden" role="tabpanel"></section>
      <section id="panel-heroes" class="panel hidden" role="tabpanel"></section>
      <section id="panel-combat" class="panel hidden" role="tabpanel"></section>
      <section id="panel-story" class="panel hidden" role="tabpanel"></section>
      <section id="panel-log" class="panel hidden" role="tabpanel"></section>
    </main>

    <div id="toast-host" class="toast-host hidden" aria-live="polite"></div>
    <footer class="footer">俠客棧 v0.4.1 style · 墨點江湖 · 劇情／Boss／成就 · 本地存檔</footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
