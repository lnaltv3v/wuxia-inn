<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="俠客棧 — 場景驅動武俠客棧 · 墨點江湖 Ink-Pixel Inn · 對齊大俠立志傳式 hub" />
  <title>俠客棧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="ink-pixel-theme hub-mode">
  <div class="app">
    <header class="topbar px-frame topbar-slim">
      <div class="brand">俠客棧<small>場景 hub · 放置養成 · 即時走位戰鬥</small></div>
      <div class="stats">
        <span class="stat-chip">銀兩 <b id="stat-silver">0</b></span>
        <span class="stat-chip">聲望 <b id="stat-rep">0</b></span>
        <span class="stat-chip" id="stat-inn">Lv.1</span>
        <span class="save-ok" id="stat-save">自動存檔</span>
      </div>
      <div class="top-actions">
        <button class="btn tiny" id="btn-manual-save" type="button">存檔</button>
        <button class="btn tiny" id="btn-hub-menu" type="button" title="次要選單">選單</button>
      </div>
    </header>

    <!-- 主畫面：大型客棧內部場景 -->
    <section class="hub-shell" aria-label="客棧內部主畫面">
      <div id="hub-stage-host" class="stage-host hub-stage-host" aria-label="客棧內部像素場景"></div>
      <p class="hub-hint" id="hub-hint">移近熱點睇提示 · 櫃檯經營 · 俠客席養成 · 大門出巡 · 告示江湖 · 地圖據點 · 書架藏書</p>
      <div id="hub-choice-bar" class="hub-choice-bar hidden" role="group" aria-label="江湖事件選擇"></div>
      <div class="hub-quickbar" role="toolbar" aria-label="快捷入口">
        <button type="button" class="hub-qbtn" data-open="inn"><span class="px-ico"><img src="assets/ui/ico_jingying.png" alt="" width="16" height="16" decoding="async"></span>經營</button>
        <button type="button" class="hub-qbtn" data-open="heroes"><span class="px-ico"><img src="assets/ui/ico_xiake.png" alt="" width="16" height="16" decoding="async"></span>俠客</button>
        <button type="button" class="hub-qbtn" data-open="combat"><span class="px-ico"><img src="assets/ui/ico_chuxun.png" alt="" width="16" height="16" decoding="async"></span>出巡</button>
        <button type="button" class="hub-qbtn" data-open="outposts"><span class="px-ico"><img src="assets/ui/ico_judian.png" alt="" width="16" height="16" decoding="async"></span>據點</button>
        <button type="button" class="hub-qbtn" data-open="story"><span class="px-ico"><img src="assets/ui/ico_jianghu.png" alt="" width="16" height="16" decoding="async"></span>江湖</button>
      </div>
    </section>

    <!-- 舊 Tab 收進次要選單 -->
    <nav class="tabs hub-menu hidden" id="hub-menu" role="tablist" aria-label="次要選單">
      <button class="tab-btn" type="button" data-tab="inn" role="tab"><span class="px-ico">經</span> 經營詳情</button>
      <button class="tab-btn" type="button" data-tab="outposts" role="tab"><span class="px-ico">據</span> 據點</button>
      <button class="tab-btn" type="button" data-tab="heroes" role="tab"><span class="px-ico">俠</span> 俠客</button>
      <button class="tab-btn" type="button" data-tab="combat" role="tab"><span class="px-ico">巡</span> 出巡</button>
      <button class="tab-btn" type="button" data-tab="story" role="tab"><span class="px-ico">江</span> 江湖</button>
      <button class="tab-btn" type="button" data-tab="log" role="tab"><span class="px-ico">誌</span> 日誌</button>
    </nav>

    <!-- 功能疊層（非戰鬥） -->
    <div id="sheet-backdrop" class="sheet-backdrop hidden" aria-hidden="true"></div>
    <aside id="sheet" class="sheet hidden px-frame" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <header class="sheet-head">
        <h2 id="sheet-title">功能</h2>
        <button type="button" class="btn tiny primary" id="btn-sheet-close">返回客棧</button>
      </header>
      <div class="sheet-body">
        <section id="panel-inn" class="panel hidden" role="tabpanel"></section>
        <section id="panel-outposts" class="panel hidden" role="tabpanel"></section>
        <section id="panel-heroes" class="panel hidden" role="tabpanel"></section>
        <section id="panel-story" class="panel hidden" role="tabpanel"></section>
        <section id="panel-log" class="panel hidden" role="tabpanel"></section>
      </div>
    </aside>

    <!-- 戰鬥全屏疊層：結束返回客棧 -->
    <div id="combat-overlay" class="combat-overlay hidden" role="dialog" aria-modal="true" aria-label="出巡戰場">
      <header class="combat-overlay-head">
        <h2>出巡戰場</h2>
        <div class="combat-speed" id="combat-speed" role="group" aria-label="戰鬥速度">
          <span class="combat-speed-label">速度</span>
          <button type="button" class="btn tiny combat-speed-btn" data-speed="0.5">0.5×</button>
          <button type="button" class="btn tiny combat-speed-btn" data-speed="1">1×</button>
          <button type="button" class="btn tiny combat-speed-btn" data-speed="1.5">1.5×</button>
          <button type="button" class="btn tiny combat-speed-btn" data-speed="2">2×</button>
        </div>
        <button type="button" class="btn tiny" id="btn-combat-back">返回客棧</button>
      </header>
      <section id="panel-combat" class="panel combat-panel" role="tabpanel"></section>
    </div>

    <div id="toast-host" class="toast-host hidden" aria-live="polite"></div>
    <footer class="footer">俠客棧 v0.6.3 · 日夜／小費 · 夜路信使 · 戰鬥速度存檔 · 墨點江湖</footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
