<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="俠客棧 v2.9.0 — 墨點江湖客棧經營＋出巡。更新後請硬重新整理。" />
  <title>俠客棧 v2.9.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="ink-pixel-theme hub-mode">
  <div class="app">
    <header class="topbar px-frame topbar-slim topbar-chips">
      <div class="brand" title="俠客棧 v2.9.0 · 墨點江湖">俠客棧</div>
      <div class="stats stats-chips" role="group" aria-label="資源">
        <span class="stat-chip" title="銀兩">銀 <b id="stat-silver">0</b></span>
        <span class="stat-chip" title="聲望">望 <b id="stat-rep">0</b></span>
        <span class="stat-chip" id="stat-inn" title="客棧等級">Lv.1</span>
        <span class="stat-chip dayphase-chip" id="stat-dayphase" data-phase="day" title="白日營業" aria-label="時辰：白日營業">晝</span>
        <span class="save-ok save-ok-chip" id="stat-save" title="存檔狀態" aria-live="polite"></span>
      </div>
      <div class="top-actions">
        <button class="btn tiny btn-chip" id="btn-manual-save" type="button" title="手動存檔">存</button>
        <button class="btn tiny btn-chip" id="btn-hub-menu" type="button" title="次要選單">⋯</button>
      </div>
    </header>

    <!-- 主畫面：大型客棧內部場景 -->
    <section class="hub-shell" aria-label="客棧內部主畫面">
      <div id="hub-stage-host" class="stage-host hub-stage-host" aria-label="客棧內部像素場景"></div>
      <div class="landscape-nudge" role="status" aria-live="polite">
        <span class="landscape-nudge-ico" aria-hidden="true">📱↔️</span>
        <div class="landscape-nudge-copy">
          <strong>請轉橫屏遊玩</strong>
          <span>直屏會擠細場景同按鈕；橫持後 Hub／戰鬥更清楚，熱點更好點。</span>
        </div>
      </div>
      <p class="hub-hint hub-hint-chip" id="hub-hint" title="熱點提示">移近高亮處 · 櫃檯經營／俠客席／大門出巡／告示／地圖／書架</p>
      <div id="hub-tour" class="hub-tour hidden" role="dialog" aria-modal="true" aria-labelledby="hub-tour-title" hidden>
        <div class="hub-tour-card px-frame">
          <p class="hub-tour-kicker" id="hub-tour-step">引導 1／3</p>
          <h3 id="hub-tour-title">櫃檯·經營</h3>
          <p id="hub-tour-body" class="hub-tour-body">點大廳櫃檯，升級設施、接待客人、累積銀兩與聲望。</p>
          <div class="btn-row hub-tour-actions">
            <button type="button" class="btn" id="btn-hub-tour-skip" aria-label="跳過新手引導">跳過</button>
            <button type="button" class="btn primary" id="btn-hub-tour-next">下一步</button>
          </div>
        </div>
      </div>
      <div id="hub-choice-bar" class="hub-choice-bar hidden" role="group" aria-label="江湖事件選擇"></div>
      <div class="hub-quickbar hub-quickbar-chips" role="toolbar" aria-label="快捷入口">
        <button type="button" class="hub-qbtn" data-open="inn" title="經營" aria-label="經營詳情"><span class="px-ico"><img src="assets/ui/ico_jingying.png" alt="" width="16" height="16" decoding="async"></span><span class="hub-qbtn-lab">經</span></button>
        <button type="button" class="hub-qbtn" data-open="heroes" title="俠客" aria-label="俠客名冊"><span class="px-ico"><img src="assets/ui/ico_xiake.png" alt="" width="16" height="16" decoding="async"></span><span class="hub-qbtn-lab">俠</span></button>
        <button type="button" class="hub-qbtn" data-open="combat" title="出巡" aria-label="出巡戰場"><span class="px-ico"><img src="assets/ui/ico_chuxun.png" alt="" width="16" height="16" decoding="async"></span><span class="hub-qbtn-lab">巡</span></button>
        <button type="button" class="hub-qbtn" data-open="outposts" title="據點" aria-label="據點分舵"><span class="px-ico"><img src="assets/ui/ico_judian.png" alt="" width="16" height="16" decoding="async"></span><span class="hub-qbtn-lab">據</span></button>
        <button type="button" class="hub-qbtn" data-open="story" title="江湖" aria-label="江湖劇情與成就"><span class="px-ico"><img src="assets/ui/ico_jianghu.png" alt="" width="16" height="16" decoding="async"></span><span class="hub-qbtn-lab">江</span></button>
      </div>
    </section>

    <!-- 舊 Tab 收進次要選單 -->
    <nav class="tabs hub-menu hidden" id="hub-menu" role="tablist" aria-label="次要選單">
      <button class="tab-btn" type="button" data-tab="inn" aria-label="經營詳情" role="tab"><span class="px-ico">經</span> 經營詳情</button>
      <button class="tab-btn" type="button" data-tab="outposts" aria-label="據點" role="tab"><span class="px-ico">據</span> 據點</button>
      <button class="tab-btn" type="button" data-tab="heroes" aria-label="俠客" role="tab"><span class="px-ico">俠</span> 俠客</button>
      <button class="tab-btn" type="button" data-tab="combat" aria-label="出巡" role="tab"><span class="px-ico">巡</span> 出巡</button>
      <button class="tab-btn" type="button" data-tab="story" aria-label="江湖" role="tab"><span class="px-ico">江</span> 江湖</button>
      <button class="tab-btn" type="button" data-tab="log" aria-label="日誌與存檔" role="tab"><span class="px-ico">誌</span> 日誌</button>
    </nav>

    <!-- 功能疊層（非戰鬥） -->
    <div id="sheet-backdrop" class="sheet-backdrop hidden" aria-hidden="true"></div>
    <aside id="sheet" class="sheet sheet-float hidden px-frame" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <header class="sheet-head">
        <h2 id="sheet-title">功能</h2>
        <button type="button" class="btn tiny primary" id="btn-sheet-close" title="Esc 或點場景亦可關閉">關閉 · Esc</button>
      </header>
      <div class="sheet-body">
        <section id="panel-inn" class="panel hidden" role="tabpanel"></section>
        <section id="panel-outposts" class="panel hidden" role="tabpanel"></section>
        <section id="panel-heroes" class="panel hidden" role="tabpanel"></section>
        <section id="panel-story" class="panel hidden" role="tabpanel"></section>
        <section id="panel-log" class="panel hidden" role="tabpanel"></section>
      </div>
    </aside>


    <!-- v2.1 廂房宣紙浮層 -->
    <div id="room-float-backdrop" class="room-float-backdrop hidden" hidden aria-hidden="true"></div>
    <aside id="room-float" class="room-float hidden px-frame" hidden role="dialog" aria-modal="true" aria-labelledby="room-float-title">
      <header class="room-float-head">
        <h2 id="room-float-title">廂房 · 歇息</h2>
        <button type="button" class="btn tiny" id="btn-room-float-close" title="Esc 關閉">關閉 · Esc</button>
      </header>
      <div id="room-float-body" class="room-float-body"></div>
    </aside>
    <!-- 戰鬥全屏疊層：結束返回客棧 -->
    <div id="combat-overlay" class="combat-overlay hidden" role="dialog" aria-modal="true" aria-label="出巡戰場">
      <div id="battle-settlement" class="hidden" hidden aria-live="polite"></div>
      <header class="combat-overlay-head">
        <h2>出巡戰場</h2>
        <div class="combat-speed px-frame" id="combat-speed" role="group" aria-label="戰鬥速度">
          <span class="combat-speed-label">⚔ 速度</span>
          <button type="button" class="btn combat-speed-btn" data-speed="0.5">0.5×</button>
          <button type="button" class="btn combat-speed-btn" data-speed="1">1×</button>
          <button type="button" class="btn combat-speed-btn" data-speed="1.5">1.5×</button>
          <button type="button" class="btn combat-speed-btn" data-speed="2">2×</button>
          <span class="combat-auto-tip" id="combat-auto-tip" hidden>
            <span class="combat-auto-tip-text">俠客會自己靠近出手</span>
            <button type="button" class="btn tiny combat-auto-tip-hide" id="btn-combat-auto-tip-hide" title="收起提示">×</button>
          </span>
          <span class="combat-combo-hud" id="combat-combo-hud" hidden aria-live="polite"></span>
        </div>
        <button type="button" class="btn tiny" id="btn-combat-back" title="Esc 亦可（非戰鬥中）">返回 · Esc</button>
      </header>
      <div id="combat-tutor" class="combat-tutor hidden" role="region" aria-label="戰鬥短教學" hidden>
        <ol class="combat-tutor-steps">
          <li class="combat-tutor-chip" data-step="1"><b>1</b> 靠近</li>
          <li class="combat-tutor-chip" data-step="2"><b>2</b> 讀招</li>
          <li class="combat-tutor-chip" data-step="3"><b>3</b> 判定</li>
        </ol>
        <p class="combat-tutor-note">看就得：靠近敵人 → 蓄勢 → 貼身出手（可調速度）</p>
        <button type="button" class="btn tiny primary" id="btn-combat-tutor-dismiss">知道了</button>
      </div>
      <section id="panel-combat" class="panel combat-panel" role="tabpanel"></section>
    </div>

    <div id="toast-host" class="toast-host hidden" aria-live="polite"></div>
    <footer class="footer" role="contentinfo">
      <div class="footer-ver">俠客棧 <b id="footer-version">v2.9.0</b> · 960×540</div>
      <div class="footer-tip">更新後若畫面舊：<kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd>（Mac：<kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd>）硬重新整理</div>
    </footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
